name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    env:
      PDK: sky130A
      PDK_ROOT: /home/runner/pdk
      TT_ARGS: ""
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout TinyTapeout support tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: main
          path: tt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install TinyTapeout dependencies
        shell: bash
        run: pip install -r tt/requirements.txt

      - name: Fetch Verilog and build configuration
        shell: bash
        run: ./tt/tt_tool.py --create-user-config $TT_ARGS

      - name: Install LibreLane
        shell: bash
        run: pip install librelane==3.0.5

      - name: Build exact-density LibreLane image
        shell: bash
        run: >-
          docker build
          -f .github/librelane-exact-density.Dockerfile
          -t nanov-librelane:3.0.5 .

      - name: Build GDS
        shell: bash
        env:
          LIBRELANE_IMAGE_OVERRIDE: nanov-librelane:3.0.5
        run: ./tt/tt_tool.py --harden $TT_ARGS

      - name: Publish build logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: GDS_logs
          path: |
            src/*
            runs/wokwi/*

      - name: Prepare TinyTapeout submission
        shell: bash
        run: ./tt/tt_tool.py --create-tt-submission $TT_ARGS

      - name: Publish TinyTapeout submission
        uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          path: |
            src/*
            docs/*
            tt_submission/*
            info.yaml
            LICENSE

      - name: Render GDS preview
        shell: bash
        run: ./tt/tt_tool.py --create-png $TT_ARGS 2>&1 || true

      - name: Publish GDS preview
        uses: actions/upload-artifact@v7
        with:
          name: gds_render
          path: gds_render.png
          if-no-files-found: ignore

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c

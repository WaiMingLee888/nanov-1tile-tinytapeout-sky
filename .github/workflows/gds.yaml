name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # LibreLane 3.0.5 does not expose OpenROAD's
      # -disable_pin_density_adjust switch as a configuration variable. The
      # raw design plus fixed cells uses 94.12% of the core, but the default
      # pin-density heuristic inflates it to 106.47% before placement starts.
      - name: Setup Python for LibreLane patch
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Enable exact-density OpenROAD placement
        shell: bash
        run: |
          pip install librelane==3.0.5
          python - <<'PY'
          from pathlib import Path
          import librelane

          script = Path(librelane.__file__).parent / "scripts/openroad/gpl.tcl"
          text = script.read_text(encoding="utf-8")
          marker = "set arg_list [list]\n"
          replacement = marker + "lappend arg_list -disable_pin_density_adjust\n"
          if text.count(marker) != 1:
              raise SystemExit(f"unexpected LibreLane GPL script: {script}")
          script.write_text(text.replace(marker, replacement), encoding="utf-8")
          print(f"patched {script}")

          # The composite TinyTapeout action runs setup-python again. Install
          # an idempotent startup guard so any package restoration is patched
          # before tt_tool starts LibreLane.
          import base64
          import site

          guard = '''
          from pathlib import Path
          import librelane
          p = Path(librelane.__file__).parent / "scripts/openroad/gpl.tcl"
          t = p.read_text(encoding="utf-8")
          m = "set arg_list [list]\\n"
          r = m + "lappend arg_list -disable_pin_density_adjust\\n"
          if r not in t:
              if t.count(m) != 1:
                  raise RuntimeError(f"unexpected LibreLane GPL script: {p}")
              p.write_text(t.replace(m, r), encoding="utf-8")
          '''
          encoded = base64.b64encode(guard.encode("utf-8")).decode("ascii")
          startup = Path(site.getsitepackages()[0]) / "nanov_exact_density.pth"
          startup.write_text(
              f"import base64;exec(base64.b64decode('{encoded}'))\n",
              encoding="utf-8",
          )
          print(f"installed startup guard {startup}")
          PY

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
